name: Docker CI y Release
 
on:
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [master]
  workflow_dispatch:
 
permissions:
  contents: read
  packages: write
 
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Ejecutar pruebas
        run: python -m pytest -v
 
  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Preparar nombre y etiquetas
        id: image
        shell: bash
        run: |
          IMAGE_PATH="${GITHUB_REPOSITORY,,}"
          IMAGE_PATH="${IMAGE_PATH%-}"
          IMAGE_NAME="ghcr.io/$IMAGE_PATH"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "tags=$IMAGE_NAME:$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE_NAME:latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Iniciar sesion en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tags }}
