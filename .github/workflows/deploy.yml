name: Despliegue Kubernetes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version a desplegar"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: [self-hosted, Windows, X64]
    environment: staging

  steps:
    - name: Descarga repositorio
      uses: actions/checkout@v4
    
    - name: Descargar imagen Docker
      shell: powershell
      run: |
        docker pull ghcr.io/paulutl/tienda-docker:${{ github.event.inputs.version }}

    - name: preparar imagen para kind
      shell: powershell
      run: |
        docker tag ghcr.io/paulutl/tienda-docker:${{ github.event.inputs.version }} tienda-api:${{ github.event.inputs.version }}
        kind load docker-image tienda-api:${{ github.event.inputs.version }} --name devops-clase

    - name: Desplegar en staging
      shell: powershell
      run: |
        kubectl apply -n staging -f k8s/service.yaml
        kubectl set image deployment/tienda-api tienda-api=tienda-api:${{ github.event.inputs.version }}

    - name: verificar despliegue
      shell: powershell
      run: |
        kubectl rollout status deployment/tienda-api -n staging --timeout=120s